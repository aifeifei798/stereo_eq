[project]
name = "stereo-eq"
version = "0.1.0"
description = "Real-time stereo equalizer for Linux Mint"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "PyQt6>=6.6",
    "sounddevice>=0.4.6",
]

[project.scripts]
stereo-eq = "stereo_eq_app.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stereo_eq_app"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
packages = ["stereo_eq_app"]
ignore_missing_imports = true
